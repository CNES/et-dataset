repos:
  - repo: local
    hooks:
    - id: hatch-fmt
      name: hatch-fmt
      entry: .pixi/envs/default/bin/hatch fmt
      language: system
      types_or: [python, pyi, jupyter]
      stages: [pre-commit]

    - id: jupyter-nb-clear-output
      name: jupyter-nb-clear-output
      files: \.ipynb$
      stages: [pre-commit]
      language: system
      types: [jupyter]
      entry: .pixi/envs/default/bin/jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
    
    - id: check-file-size
      name: check-file-size
      entry: hooks/check-file-size.sh
      language: script
      stages: [pre-commit]
      pass_filenames: false
