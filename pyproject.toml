[project]
name = "et-dataset"
version = "0.0.1"
description = 'Data preparation for ET dataset'
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Public-Domain"
keywords = []
authors = [
  { name = "Emmanuelle Sarrazin", email = "emmanuelle.sarrazin@cnes.fr" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "affine",
  "cdsapi",
  "cftime",
  "geopandas",
  "numpy",
  "pandas",
  "pyproj",
  "rasterio",
  "shapely",
  "psutil",
  "fiona",
  "tqdm",
  "xarray",
  "earthaccess",
  "sensorsio",
  "theia-picker",
  "pyBVNET @ git+https://forge.ird.fr/cesbio/modelisation/pybvnet.git@75d4a534afd5361f3d90637a3574494fbf5d194e",
  "scikit-image",
  "requests",
  "pyarrow",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pip-review",
  "pre-commit",
  "ruff",
  "mypy",
]
notebook = [
  "matplotlib",
  "jupyterlab",
  "notebook",
  "ipywidgets",
]

[project.urls]
Source = "https://src.koda.cnrs.fr/trishna/et-dataset"

[project.scripts]
et-dataset = "etdataset.cli:etdataset"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/etdataset"]


[tool.pytest.ini_options]
filterwarnings = [
  "ignore",
  "default:::etdataset",
        ]
testpaths=["tests"]

[tool.coverage.run]
source = ["etdataset", "tests"]
branch = true
parallel = true
omit = [
  "src/etdataset/__about__.py",
    "./.pixi/*",
  "./hooks/*",
]

[tool.coverage.paths]
et_dataset = ["src/etdataset", "*/et-dataset/src/etdataset"]
tests = ["tests", "*/et-dataset/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
plugins = ["numpy.typing.mypy_plugin"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "affine",
    "earthaccess.*",
    "geopandas",
    "fiona.*",
    "landsatxplore.*",
    "matplotlib.*",
    "scipy.*",
    "rasterio.*",
    "sensorsio.*",
    "shapely.*",
    "theia_picker.*",
    "cdsapi",
    "pytest",
        ]
ignore_missing_imports = true

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64","win-64","osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
et-dataset = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev","notebook"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
pip = ">=25.0.1,<26"
gdal = ">=3.10.2,<4"
hdf4 = ">=4.2.15,<5"
hdf5 = ">=1.14.4,<2"
netcdf4 = ">=1.7.2,<2"
h5netcdf = ">=1.6.1,<2"
